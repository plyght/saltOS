    - id: arch
      name: "Arch Linux (pacman)"
      description: "Arch Linux as the primary stratum. Rolling packages from the Arch repositories, exposed through salt on top of the native saltOS base."
      screenshot: ":/images/no-selection.png"
    - id: alpine
      name: "Alpine Linux (apk)"
      description: "Alpine Linux as the primary stratum. A small musl-based userland with apk, exposed through salt on top of the native saltOS base."
      screenshot: ":/images/no-selection.png"
    - id: void
      name: "Void Linux (xbps)"
      description: "Void Linux as the primary stratum. Rolling packages with xbps, exposed through salt on top of the native saltOS base."
      screenshot: ":/images/no-selection.png"
    - id: fedora
      name: "Fedora (dnf)"
      description: "Fedora as the primary stratum. Recent packages with dnf, exposed through salt on top of the native saltOS base."
      screenshot: ":/images/no-selection.png"
    - id: opensuse
      name: "openSUSE (zypper)"
      description: "openSUSE Tumbleweed as the primary stratum. Rolling packages with zypper, exposed through salt on top of the native saltOS base."
