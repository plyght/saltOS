name: installer-iso

on:
  workflow_call:
  workflow_dispatch:
  push:
    paths:
      - "os/iso/live-build.sh"
      - "os/iso/live/**"
      - "os/iso/tests/**"
      - "os/iso/qemu-install-test.sh"
      - "os/installer/**"
      - "src/setup/**"
      - ".github/workflows/installer-iso.yml"

jobs:
  build:
    name: installer ISO (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup 2>/dev/null || true
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mmdebstrap debian-archive-keyring squashfs-tools xorriso mtools \
            grub-pc-bin grub-efi-amd64-bin grub-common

      - name: Build salt and salt-setup against the Debian base
        run: |
          docker run --rm -v "$PWD":/src -w /src debian:bookworm bash -c '
            set -e
            apt-get update
            apt-get install -y --no-install-recommends \
              cmake ninja-build pkg-config g++ ca-certificates \
              libzstd-dev libsodium-dev libsqlite3-dev
            cmake -G Ninja -B build-iso -DCMAKE_BUILD_TYPE=Release
            cmake --build build-iso --target salt salt-setup'

      - name: Build installer ISO
        run: |
          sudo env \
            SALT_BIN="$PWD/build-iso/src/salt/salt" \
            SALTSETUP_BIN="$PWD/build-iso/src/setup/salt-setup" \
            REPO_DIR="$PWD" \
            EDITION="installer" \
            VERSION="0.1.0" \
            OUT="$PWD/out-iso" \
            bash os/iso/live-build.sh x86_64
          sudo chown -R "$USER" out-iso

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: saltos-installer-x86_64
          path: out-iso/*.iso
          if-no-files-found: error

  install:
    name: ${{ matrix.mode }} install (${{ matrix.firmware }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mode: text, firmware: bios, config: os/iso/tests/text-erase-btrfs.lua }
          - { mode: text, firmware: uefi, config: os/iso/tests/text-erase-ext4.lua }
          - { mode: calamares, firmware: uefi, config: os/iso/tests/calamares-erase-btrfs.lua }
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils ovmf socat netpbm
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
          ls -l /dev/kvm || echo "no KVM; running under TCG"

      - uses: actions/download-artifact@v4
        with:
          name: saltos-installer-x86_64
          path: out-iso

      - name: Install and reboot under QEMU
        run: |
          ISO=$(ls out-iso/*.iso | head -1)
          bash os/iso/qemu-install-test.sh \
            --iso "$ISO" \
            --config "${{ matrix.config }}" \
            --mode "${{ matrix.mode }}" \
            --firmware "${{ matrix.firmware }}" \
            --out "$PWD/qemu-test"

      - name: Upload serial logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.mode }}-${{ matrix.firmware }}-logs
          path: |
            qemu-test/*.log
            qemu-test/shots/*
          if-no-files-found: ignore
