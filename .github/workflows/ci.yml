name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.arch }}${{ matrix.sanitize == 'ON' && ', asan+ubsan' || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            build_type: Release
            sanitize: "OFF"
          - arch: aarch64
            runner: ubuntu-24.04-arm
            build_type: Release
            sanitize: "OFF"
          - arch: x86_64
            runner: ubuntu-latest
            build_type: Debug
            sanitize: "ON"
    runs-on: ${{ matrix.runner }}
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config \
            libzstd-dev libsodium-dev libsqlite3-dev \
            build-essential

      - name: Cache CMake build tree
        uses: actions/cache@v4
        with:
          path: build
          key: cmake-${{ matrix.arch }}-${{ matrix.build_type }}-san${{ matrix.sanitize }}-${{ hashFiles('CMakeLists.txt', 'src/**/CMakeLists.txt', 'src/**/*.c', 'src/**/*.cpp', 'src/**/*.h') }}
          restore-keys: |
            cmake-${{ matrix.arch }}-${{ matrix.build_type }}-san${{ matrix.sanitize }}-

      - name: Lower ASLR entropy for AddressSanitizer
        if: matrix.sanitize == 'ON'
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Configure
        run: cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DSALT_SANITIZE=${{ matrix.sanitize }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
