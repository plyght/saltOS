name: lint

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-lint:
    name: clang-format + clang-tidy + cppcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install lint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config \
            libzstd-dev libsodium-dev libsqlite3-dev \
            build-essential clang-format clang-tidy cppcheck

      - name: clang-format check
        run: |
          find src/halite src/salt tests \
            \( -name '*.c' -o -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

      - name: Configure (compile database)
        run: cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release

      - name: clang-tidy
        run: |
          files="$(find src/halite/src src/salt \( -name '*.c' -o -name '*.cpp' \))"
          run-clang-tidy -p build -quiet $files

      - name: cppcheck
        run: |
          cppcheck -q --error-exitcode=1 --enable=warning,performance,portability \
            --inline-suppr --std=c11 -I src/halite/include src/halite/src
          cppcheck -q --error-exitcode=1 --enable=warning,performance,portability \
            --inline-suppr --std=c++20 -I src/halite/include src/salt

  recipe-lint:
    name: salt lint + supply-chain scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config \
            libzstd-dev libsodium-dev libsqlite3-dev \
            build-essential

      - name: Build salt
        run: |
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target salt

      - name: Determine changed recipes
        id: changed
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          dirs="$(git diff --name-only "$base" "$head" -- 'recipes/**' \
            | sed -n 's#^\(recipes/[^/]\+\)/.*#\1#p' | sort -u)"
          {
            echo "dirs<<EOF"
            echo "$dirs"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Lint and scan changed recipes
        run: |
          export PATH="$PWD/build/src/salt:$PATH"
          status=0
          if [ -z "${{ steps.changed.outputs.dirs }}" ]; then
            echo "No recipe directories changed."
            exit 0
          fi
          while IFS= read -r dir; do
            [ -n "$dir" ] || continue
            echo "::group::$dir"
            salt lint "$dir" || status=1
            salt trust scan "$dir" || status=1
            echo "::endgroup::"
          done <<< "${{ steps.changed.outputs.dirs }}"
          exit $status
