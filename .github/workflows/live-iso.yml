name: live-iso

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      edition:
        description: "console or desktop"
        default: "desktop"
  push:
    paths:
      - "os/iso/live-build.sh"
      - "os/iso/live/**"
      - "os/installer/**"
      - "src/setup/**"
      - ".github/workflows/live-iso.yml"

jobs:
  build:
    name: live ISO (x86_64, ${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { edition: console, e2e: "0", label: console }
          - { edition: console, e2e: "1", label: e2e }
          - { edition: desktop, e2e: "0", label: desktop }
    env:
      EDITION: ${{ matrix.edition }}
      SALTOS_E2E: ${{ matrix.e2e }}
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup 2>/dev/null || true
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config \
            libzstd-dev libsodium-dev libsqlite3-dev build-essential \
            mmdebstrap debian-archive-keyring squashfs-tools xorriso mtools \
            grub-pc-bin grub-efi-amd64-bin grub-common \
            qemu-system-x86 ovmf socat netpbm

      - name: Build salt against the Debian base
        run: |
          docker run --rm -v "$PWD":/src -w /src debian:bookworm bash -c '
            set -e
            apt-get update
            apt-get install -y --no-install-recommends \
              cmake ninja-build pkg-config g++ ca-certificates \
              libzstd-dev libsodium-dev libsqlite3-dev
            cmake -G Ninja -B build-iso -DCMAKE_BUILD_TYPE=Release
            cmake --build build-iso --target salt salt-setup'

      - name: Build live ISO
        run: |
          sudo env \
            SALT_BIN="$PWD/build-iso/src/salt/salt" \
            SALTSETUP_BIN="$PWD/build-iso/src/setup/salt-setup" \
            REPO_DIR="$PWD" \
            EDITION="$EDITION" \
            SALTOS_E2E="$SALTOS_E2E" \
            VERSION="0.1.0" \
            OUT="$PWD/out-iso" \
            bash os/iso/live-build.sh x86_64
          sudo chown -R "$USER" out-iso

      - name: Boot test (QEMU)
        run: |
          ISO=$(ls out-iso/*.iso | head -1)
          echo "boot-testing $ISO (edition=$EDITION e2e=$SALTOS_E2E)"
          if [ "$SALTOS_E2E" = "1" ]; then
            bash os/iso/qemu-boot-test.sh --iso "$ISO" --arch x86_64 --mem 2560 --timeout 600 --net \
              --ok SALTOS_STRATUM_E2E_OK --fail SALTOS_STRATUM_E2E_FAIL --also SALTOS_BOOT_OK --log qemu.log
          elif [ "$EDITION" = "desktop" ]; then
            bash os/iso/qemu-boot-test.sh --iso "$ISO" --arch x86_64 --mem 4096 --timeout 600 \
              --ok SALTOS_DESKTOP_OK --also SALTOS_BOOT_OK \
              --log qemu.log --screenshot saltos-desktop.png
          else
            bash os/iso/qemu-boot-test.sh --iso "$ISO" --arch x86_64 --mem 2560 --timeout 480 \
              --ok SALTOS_BOOT_OK --also SALTOS_STRATUM_OK --log qemu.log
          fi

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saltos-desktop-screenshot-${{ matrix.label }}
          path: saltos-desktop.png
          if-no-files-found: ignore

      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-serial-log-${{ matrix.label }}
          path: qemu.log
          if-no-files-found: ignore

      - name: Upload ISO
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saltos-live-x86_64-${{ matrix.label }}
          path: out-iso/*.iso
          if-no-files-found: error
