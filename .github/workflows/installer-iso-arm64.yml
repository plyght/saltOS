name: installer-iso-arm64

on:
  workflow_dispatch:
  push:
    paths:
      - "os/iso/live-build.sh"
      - "os/iso/live/**"
      - "os/iso/tests/**"
      - "os/iso/qemu-install-test.sh"
      - "os/iso/qemu-boot-test.sh"
      - "os/installer/**"
      - "src/setup/**"
      - ".github/workflows/installer-iso-arm64.yml"

concurrency:
  group: installer-iso-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: installer ISO (aarch64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup 2>/dev/null || true
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config \
            libzstd-dev libsodium-dev libsqlite3-dev build-essential \
            mmdebstrap debian-archive-keyring squashfs-tools xorriso mtools \
            grub-efi-arm64-bin grub-common \
            qemu-system-arm qemu-system-data qemu-efi-aarch64 qemu-utils socat netpbm

      - name: Build salt and salt-setup against the Debian base (arm64)
        run: |
          docker run --rm -v "$PWD":/src -w /src debian:bookworm bash -c '
            set -e
            apt-get update
            apt-get install -y --no-install-recommends \
              cmake ninja-build pkg-config g++ ca-certificates \
              libzstd-dev libsodium-dev libsqlite3-dev
            cmake -G Ninja -B build-iso -DCMAKE_BUILD_TYPE=Release
            cmake --build build-iso --target salt salt-setup'

      - name: Build installer ISO (aarch64)
        run: |
          sudo env \
            SALT_BIN="$PWD/build-iso/src/salt/salt" \
            SALTSETUP_BIN="$PWD/build-iso/src/setup/salt-setup" \
            REPO_DIR="$PWD" \
            EDITION="installer" \
            VERSION="0.1.0" \
            OUT="$PWD/out-iso" \
            bash os/iso/live-build.sh aarch64
          sudo chown -R "$USER" out-iso

      - name: Live boot test (QEMU aarch64, UEFI)
        run: |
          ISO=$(ls out-iso/*.iso | head -1)
          bash os/iso/qemu-boot-test.sh --iso "$ISO" --arch aarch64 --mem 3072 --timeout 1200 \
            --ok SALTOS_BOOT_OK --also SALTOS_STRATUM_OK --log qemu.log

      - name: Text install and reboot (QEMU aarch64, UEFI)
        run: |
          ISO=$(ls out-iso/*.iso | head -1)
          bash os/iso/qemu-install-test.sh \
            --iso "$ISO" \
            --config os/iso/tests/text-erase-btrfs-aarch64.toml \
            --mode text \
            --firmware uefi \
            --arch aarch64 \
            --install-timeout 4800 \
            --boot-timeout 1200 \
            --out "$PWD/qemu-test"

      - name: Upload serial logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-arm64-logs
          path: |
            qemu.log
            qemu-test/*.log
            qemu-test/shots/*
          if-no-files-found: ignore

      - name: Upload ISO
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saltos-installer-aarch64
          path: out-iso/*.iso
          if-no-files-found: warn
