name = "xauth"
version = "1.1.3"
release = 1
summary = "X authority file utility"
license = "MIT"
arch = ["x86_64", "aarch64"]

[source]
url = "https://www.x.org/releases/individual/app/xauth-1.1.3.tar.xz"
sha256 = "e7075498bae332f917f01d660f9b940c0752b2556a8da61ccb62a44d0ffe9d33"

[build]
system = "autotools"
deps = ["pkgconf", "gcc", "make", "libx11", "libxau", "libxext", "libxmu"]
script = """
#!/bin/sh
./configure --prefix=/usr --sysconfdir=/etc --localstatedir=/var --disable-static
make -j"$SALT_JOBS"
make DESTDIR="$SALT_DEST" install
"""

[package]
deps = ["glibc", "libx11", "libxau", "libxext", "libxmu"]

[reproducibility]
status = "verified"
