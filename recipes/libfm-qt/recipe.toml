name = "libfm-qt"
version = "2.1.0"
release = 2
summary = "Qt port of libfm (file management library)"
license = "LGPL-2.1-or-later"
arch = ["x86_64", "aarch64"]

[source]
url = "https://github.com/lxqt/libfm-qt/releases/download/2.1.0/libfm-qt-2.1.0.tar.xz"
sha256 = "bfa03ee1d8ae9e50f33b31d50a5cb0ffbca5e6d6f5dd3a0df04c8300fc1a29d7"

[build]
system = "cmake"
deps = ["cmake", "ninja", "pkgconf", "gcc", "qt6-base", "qt6-tools", "glib", "menu-cache", "lxqt-menu-data", "libexif", "libxcb", "lxqt-build-tools"]
script = """
#!/bin/sh
cmake -G Ninja -S "$SALT_SRC" -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_INSTALL_SYSCONFDIR=/etc -DBUILD_DOCUMENTATION=OFF
cmake --build build -j"$SALT_JOBS"
DESTDIR="$SALT_DEST" cmake --install build
"""

[package]
deps = ["glibc", "qt6-base", "glib", "menu-cache", "lxqt-menu-data", "libexif", "libxcb"]

[reproducibility]
status = "verified"
