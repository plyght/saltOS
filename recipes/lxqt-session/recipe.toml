name = "lxqt-session"
version = "2.1.0"
release = 2
summary = "LXQt session manager"
license = "LGPL-2.1-or-later"
arch = ["x86_64", "aarch64"]

[source]
url = "https://github.com/lxqt/lxqt-session/releases/download/2.1.0/lxqt-session-2.1.0.tar.xz"
sha256 = "b745ef14afec4bed788aeb2d448861fbc0c6f738c1ce956f4a6450f6c745270b"

[build]
system = "cmake"
deps = ["cmake", "ninja", "pkgconf", "gcc", "qt6-base", "qt6-tools", "liblxqt", "kwindowsystem", "qtxdg-tools", "layer-shell-qt", "xdg-user-dirs", "eudev", "procps-ng", "libx11", "lxqt-build-tools"]
script = """
#!/bin/sh
cmake -G Ninja -S "$SALT_SRC" -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_INSTALL_SYSCONFDIR=/etc
cmake --build build -j"$SALT_JOBS"
DESTDIR="$SALT_DEST" cmake --install build
"""

[package]
deps = ["glibc", "qt6-base", "liblxqt", "kwindowsystem", "layer-shell-qt", "xdg-user-dirs", "eudev", "procps-ng", "libx11", "qtxdg-tools", "openbox"]

[reproducibility]
status = "verified"
