name = "saltos-desktop"
version = "0.1.0"
release = 1
summary = "saltOS desktop defaults (SDDM, LXQt session, X session wrapper)"
license = "MIT"
arch = ["x86_64", "aarch64"]

[source]
url = "file://./os/desktop"

[build]
system = "custom"
deps = ["coreutils"]
script = """
#!/bin/sh
install -Dm644 sddm.conf.d/10-saltos.conf "$SALT_DEST/etc/sddm.conf.d/10-saltos.conf"
install -Dm755 Xsession "$SALT_DEST/usr/lib/saltos/Xsession"
install -Dm644 xdg/lxqt/session.conf "$SALT_DEST/etc/xdg/lxqt/session.conf"
install -Dm644 xdg/lxqt/lxqt.conf "$SALT_DEST/etc/xdg/lxqt/lxqt.conf"
"""

[package]
deps = ["sddm", "lxqt-session", "lxqt-panel", "openbox", "dbus"]

[reproducibility]
status = "verified"
