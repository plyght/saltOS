name = "qt6-base"
version = "6.7.2"
release = 2
summary = "Qt 6 base modules (Core, Gui, Widgets, DBus, Network, Sql, Xml, xcb)"
license = "LGPL-3.0-only"
arch = ["x86_64", "aarch64"]

[source]
url = "https://download.qt.io/archive/qt/6.7/6.7.2/submodules/qtbase-everywhere-src-6.7.2.tar.xz"
sha256 = "c5f22a5e10fb162895ded7de0963328e7307611c688487b5d152c9ee64767599"

[build]
system = "cmake"
deps = ["cmake", "ninja", "pkgconf", "gcc", "openssl", "zlib", "libpng", "libjpeg-turbo", "freetype", "fontconfig", "harfbuzz", "pcre2", "sqlite", "glib", "dbus", "mesa", "libdrm", "libxkbcommon", "xcb-util", "xcb-util-image", "xcb-util-keysyms", "xcb-util-renderutil", "xcb-util-wm", "xcb-util-cursor", "zstd", "perl", "libx11", "libxext", "libxfixes", "libxrender", "libxrandr", "libxi", "libxcursor", "libxcb"]
script = """
#!/bin/sh
cmake -G Ninja -S "$SALT_SRC" -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_INSTALL_SYSCONFDIR=/etc -DINSTALL_ARCHDATADIR=lib/qt6 -DINSTALL_DATADIR=share/qt6 -DINSTALL_INCLUDEDIR=include/qt6 -DINSTALL_DOCDIR=share/doc/qt6 -DINSTALL_SYSCONFDIR=/etc/xdg -DINSTALL_EXAMPLESDIR=share/doc/qt6/examples -DQT_BUILD_EXAMPLES=OFF -DQT_BUILD_TESTS=OFF -DFEATURE_openssl_linked=ON -DFEATURE_system_sqlite=ON -DFEATURE_system_harfbuzz=ON -DFEATURE_system_pcre2=ON -DFEATURE_system_zlib=ON -DFEATURE_system_png=ON -DFEATURE_system_jpeg=ON -DFEATURE_system_freetype=ON -DFEATURE_xcb=ON -DFEATURE_xcb_xlib=ON -DFEATURE_xkbcommon=ON -DFEATURE_xkbcommon_x11=ON -DFEATURE_opengl_desktop=ON -DFEATURE_egl=ON -DFEATURE_dbus_linked=ON -DFEATURE_glib=ON -DFEATURE_icu=OFF -DFEATURE_journald=OFF -DFEATURE_gtk3=OFF -DFEATURE_vulkan=OFF -DFEATURE_libinput=OFF -DFEATURE_tslib=OFF -DFEATURE_mtdev=OFF -DFEATURE_libproxy=OFF
cmake --build build -j"$SALT_JOBS"
DESTDIR="$SALT_DEST" cmake --install build
"""

[package]
deps = ["glibc", "openssl", "zlib", "libpng", "libjpeg-turbo", "freetype", "fontconfig", "harfbuzz", "pcre2", "sqlite", "glib", "dbus", "mesa", "libdrm", "libxkbcommon", "xcb-util", "xcb-util-image", "xcb-util-keysyms", "xcb-util-renderutil", "xcb-util-wm", "xcb-util-cursor", "zstd", "libx11", "libxcb"]

[reproducibility]
status = "verified"
