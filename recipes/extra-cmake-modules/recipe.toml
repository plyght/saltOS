name = "extra-cmake-modules"
version = "6.7.0"
release = 1
summary = "Extra CMake modules (KDE)"
license = "BSD-3-Clause"
arch = ["x86_64", "aarch64"]

[source]
url = "https://download.kde.org/stable/frameworks/6.7/extra-cmake-modules-6.7.0.tar.xz"
sha256 = "d81de82692d3d2bb77110332a65c8266252becc2c3f307ce814990ce5607b8dc"

[build]
system = "cmake"
deps = ["cmake", "ninja", "gcc"]
script = """
#!/bin/sh
cmake -G Ninja -S "$SALT_SRC" -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_INSTALL_SYSCONFDIR=/etc -DBUILD_TESTING=OFF -DBUILD_HTML_DOCS=OFF -DBUILD_MAN_DOCS=OFF -DBUILD_QTHELP_DOCS=OFF
cmake --build build -j"$SALT_JOBS"
DESTDIR="$SALT_DEST" cmake --install build
"""

[package]
deps = []

[reproducibility]
status = "verified"
