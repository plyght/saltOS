name = "sddm"
version = "0.21.0"
release = 2
summary = "QML-based X11 display manager"
license = "GPL-2.0-or-later"
arch = ["x86_64", "aarch64"]

[source]
url = "https://github.com/sddm/sddm/archive/refs/tags/v0.21.0.tar.gz"
sha256 = "f895de2683627e969e4849dbfbbb2b500787481ca5ba0de6d6dfdae5f1549abf"

[build]
system = "cmake"
deps = ["cmake", "ninja", "pkgconf", "gcc", "extra-cmake-modules", "qt6-base", "qt6-declarative", "qt6-tools", "libxcb", "libxau", "libxkbcommon", "libxcrypt", "shadow", "dbus"]
script = """
#!/bin/sh
cmake -G Ninja -S "$SALT_SRC" -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
  -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_INSTALL_SYSCONFDIR=/etc -DBUILD_WITH_QT6=ON -DNO_PAM=ON \
  -DNO_SYSTEMD=ON -DENABLE_JOURNALD=OFF -DBUILD_MAN_PAGES=OFF -DRUNTIME_DIR=/run/sddm \
  -DSTATE_DIR=/var/lib/sddm -DDBUS_CONFIG_DIR=/usr/share/dbus-1/system.d \
  -DHALT_COMMAND=/sbin/poweroff -DREBOOT_COMMAND=/sbin/reboot -DUID_MIN=1000 -DUID_MAX=60000
cmake --build build -j"$SALT_JOBS"
DESTDIR="$SALT_DEST" cmake --install build
"""

[package]
deps = ["glibc", "qt6-base", "qt6-declarative", "libxcb", "libxau", "libxkbcommon", "libxcrypt", "xorg-server", "xauth", "dbus", "shadow"]

[hooks]
post_install = """
getent group sddm >/dev/null || groupadd -r sddm
getent passwd sddm >/dev/null || useradd -r -g sddm -d /var/lib/sddm -s /sbin/nologin -c "SDDM greeter" sddm
mkdir -p /var/lib/sddm
chown sddm:sddm /var/lib/sddm
"""

[reproducibility]
status = "verified"
