name = "libexif"
version = "0.6.24"
release = 1
summary = "EXIF metadata library"
license = "LGPL-2.1-or-later"
arch = ["x86_64", "aarch64"]

[source]
url = "https://github.com/libexif/libexif/releases/download/v0.6.24/libexif-0.6.24.tar.bz2"
sha256 = "d47564c433b733d83b6704c70477e0a4067811d184ec565258ac563d8223f6ae"

[build]
system = "autotools"
deps = ["pkgconf", "gcc", "make"]
script = """
#!/bin/sh
./configure --prefix=/usr --sysconfdir=/etc --localstatedir=/var --disable-static --disable-docs
make -j"$SALT_JOBS"
make DESTDIR="$SALT_DEST" install
"""

[package]
deps = ["glibc"]

[reproducibility]
status = "verified"
