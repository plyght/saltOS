name = "ncurses"
version = "6.5"
release = 3
summary = "Library for terminal-independent text user interfaces"
license = "MIT"
arch = ["x86_64", "aarch64"]

[source]
url = "https://ftp.gnu.org/gnu/ncurses/ncurses-6.5.tar.gz"
sha256 = "136d91bc269a9a5785e5f9e980bc76ab57428f604ce3e5a5a90cebc767971cc6"

[build]
system = "autotools"
deps = ["gcc", "make"]
script = """
#!/bin/sh
./configure --prefix=/usr \\
    --mandir=/usr/share/man \\
    --with-shared \\
    --without-debug \\
    --without-normal \\
    --with-cxx-shared \\
    --enable-pc-files \\
    --with-pkg-config-libdir=/usr/lib/pkgconfig \\
    --enable-widec
make -j"$SALT_JOBS"
make DESTDIR="$SALT_DEST" install
for lib in ncurses form panel menu; do
    ln -sf lib${lib}w.so "$SALT_DEST/usr/lib/lib${lib}.so"
    ln -sf ${lib}w.pc "$SALT_DEST/usr/lib/pkgconfig/${lib}.pc"
done
ln -sf libncursesw.so "$SALT_DEST/usr/lib/libcurses.so"
mkdir -p "$SALT_DEST/usr/include/ncursesw"
for h in "$SALT_DEST"/usr/include/*.h; do
    ln -sf "../$(basename "$h")" "$SALT_DEST/usr/include/ncursesw/$(basename "$h")"
done
"""

[package]
deps = ["glibc"]

[reproducibility]
status = "verified"
