name = "llvm"
version = "18.1.8"
release = 2
summary = "LLVM compiler infrastructure (host + AMDGPU targets, for Mesa)"
license = "Apache-2.0"
arch = ["x86_64", "aarch64"]

[source]
url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/llvm-project-18.1.8.src.tar.xz"
sha256 = "0b58557a6d32ceee97c8d533a59b9212d87e0fc4d2833924eb6c611247db2f2a"

[build]
system = "cmake"
deps = ["cmake", "ninja", "pkgconf", "zlib", "zstd", "gcc", "python"]
script = """
#!/bin/sh
case "$SALT_ARCH" in
  x86_64) targets="X86;AMDGPU" ;;
  *) targets="AArch64;AMDGPU" ;;
esac
cmake -G Ninja -S "$SALT_SRC/llvm" -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
  -DCMAKE_INSTALL_LIBDIR=lib -DLLVM_TARGETS_TO_BUILD="$targets" -DLLVM_ENABLE_RTTI=ON \
  -DLLVM_BUILD_LLVM_DYLIB=ON -DLLVM_LINK_LLVM_DYLIB=ON -DLLVM_ENABLE_ASSERTIONS=OFF \
  -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF -DLLVM_INCLUDE_BENCHMARKS=OFF \
  -DLLVM_INCLUDE_DOCS=OFF -DLLVM_ENABLE_BINDINGS=OFF -DLLVM_ENABLE_LIBXML2=OFF \
  -DLLVM_ENABLE_ZLIB=ON -DLLVM_ENABLE_ZSTD=ON -DLLVM_INSTALL_UTILS=ON -DLLVM_PARALLEL_LINK_JOBS=1
cmake --build build -j"$SALT_JOBS"
DESTDIR="$SALT_DEST" cmake --install build
"""

[package]
deps = ["glibc", "zlib", "zstd"]

[reproducibility]
status = "verified"
